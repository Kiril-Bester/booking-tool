<div class="row justify-content-center align-items-center min-vh-75">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-lg">
      <div class="card-header bg-success text-white text-center py-4 border-0">
        <i class="bi bi-person-plus-fill fs-1"></i>
        <h3 class="mb-0 mt-2">Create Account</h3>
        <p class="mb-0 opacity-75">Join ReserveHub today</p>
      </div>
      <div class="card-body p-4">
        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-person me-2"></i>Username
            </label>
            <input type="text" 
                   class="form-control form-control-lg" 
                   [(ngModel)]="userData.username" 
                   name="username" 
                   placeholder="Choose a username" 
                   required>
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-envelope me-2"></i>Email Address
            </label>
            <input type="email" 
                   class="form-control form-control-lg" 
                   [(ngModel)]="userData.email" 
                   name="email" 
                   placeholder="Enter your email" 
                   required>
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-lock me-2"></i>Password
            </label>
            <input type="password" 
                   class="form-control form-control-lg" 
                   [(ngModel)]="userData.password" 
                   name="password" 
                   placeholder="Create a password (min 6 characters)" 
                   required>
          </div>
          
          <button type="submit" 
                  class="btn btn-success btn-lg w-100 rounded-pill" 
                  [disabled]="loading">
            <span *ngIf="!loading">
              <i class="bi bi-check-circle me-2"></i>Register
            </span>
            <span *ngIf="loading">
              <span class="spinner-border spinner-border-sm me-2"></span>Creating account...
            </span>
          </button>
          
          <div class="mt-3 text-center">
            <p class="text-muted">Already have an account? 
              <a routerLink="/login" class="text-success text-decoration-none">Sign in here</a>
            </p>
          </div>
          
          <div class="alert alert-danger mt-3" *ngIf="error">
            <i class="bi bi-exclamation-triangle me-2"></i>{{error}}
          </div>
          
          <div class="alert alert-success mt-3" *ngIf="success">
            <i class="bi bi-check-circle me-2"></i>Registration successful! Redirecting to login...
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<style>
  .min-vh-75 {
    min-height: 75vh;
  }
</style>
