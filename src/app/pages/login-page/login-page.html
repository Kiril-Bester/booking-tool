<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-primary text-white text-center py-4 border-0">
        <i class="bi bi-box-arrow-in-right fs-1"></i>
        <h3 class="mb-0 mt-2">Welcome Back</h3>
        <p class="mb-0 opacity-75">Sign in to your account</p>
      </div>
      <div class="card-body p-4">
        <!-- Demo Credentials -->
        <div class="alert alert-info small">
          <i class="bi bi-info-circle me-2"></i>
          <strong>Demo Credentials:</strong><br>
          Username: <code>admin</code><br>
          Password: <code>admin123</code>
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-person me-2"></i>Username
            </label>
            <input type="text" 
                   class="form-control form-control-lg" 
                   [(ngModel)]="credentials.username" 
                   name="username" 
                   placeholder="Enter your username" 
                   required>
          </div>
          
          <div class="mb-3">
            <label class="form-label fw-semibold">
              <i class="bi bi-lock me-2"></i>Password
            </label>
            <input type="password" 
                   class="form-control form-control-lg" 
                   [(ngModel)]="credentials.password" 
                   name="password" 
                   placeholder="Enter your password" 
                   required>
          </div>
          
          <button type="submit" 
                  class="btn btn-primary btn-lg w-100 rounded-pill" 
                  [disabled]="loading">
            <span *ngIf="!loading">
              <i class="bi bi-box-arrow-in-right me-2"></i>Login
            </span>
            <span *ngIf="loading">
              <span class="spinner-border spinner-border-sm me-2"></span>Logging in...
            </span>
          </button>
          
          <div class="mt-3 text-center">
            <p class="text-muted">Don't have an account? 
              <a routerLink="/register" class="text-primary text-decoration-none">Register here</a>
            </p>
          </div>
          
          <div class="alert alert-danger mt-3" *ngIf="error">
            <i class="bi bi-exclamation-triangle me-2"></i>{{error}}
          </div>
          
          <div class="alert alert-success mt-3" *ngIf="success">
            <i class="bi bi-check-circle me-2"></i>Login successful! Redirecting...
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
